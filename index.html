<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Target vs Actual — Channel Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F5F6F8;
    --surface: #FFFFFF;
    --ink: #1A2332;
    --muted: #6B7280;
    --border: #E4E7EC;
    --target: #3B6E8F;
    --target-tint: #E8EFF3;
    --actual: #D97B29;
    --actual-tint: #FBEDDD;
    --good: #2F9E64;
    --good-tint: #E6F6EC;
    --bad: #D14343;
    --bad-tint: #FCEAEA;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
  }

  .num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }

  header {
    background: var(--ink);
    padding: 22px 32px 18px;
  }

  header h1 {
    margin: 0;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  header .sub {
    color: #9AA5B8;
    font-size: 13px;
    margin-top: 3px;
  }

  .sample-banner {
    background: var(--actual);
    color: #fff;
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
    padding: 7px;
  }

  .tab-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 32px;
    position: sticky;
    top: 0;
    z-index: 50;
  }

  .tab-btn {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
  }

  .tab-btn:hover { background: var(--bg); }

  .tab-btn.active {
    background: var(--ink);
    color: #fff;
  }

  .tab-btn.company-tab {
    border: 1.5px solid var(--target);
    font-weight: 700;
  }
  .tab-btn.company-tab.active {
    background: var(--target);
    border-color: var(--target);
  }

  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 32px 60px;
  }

  .channel-title {
    font-size: 26px;
    font-weight: 700;
    margin: 4px 0 2px;
  }

  .channel-sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 22px;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 22px 24px;
    margin-bottom: 20px;
  }

  .section-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
    flex-wrap: wrap;
    gap: 6px;
  }

  .section-head h2 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
  }

  .section-head .unit-note {
    font-size: 11.5px;
    color: var(--muted);
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  .stat-card {
    background: var(--bg);
    border-radius: 8px;
    padding: 12px 14px;
  }

  .stat-card .label {
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .stat-card .value {
    font-size: 20px;
  }

  .stat-card .value.target { color: var(--target); }
  .stat-card .value.actual { color: var(--actual); }
  .stat-card .delta {
    font-size: 11.5px;
    margin-top: 3px;
    font-weight: 600;
  }
  .delta.good { color: var(--good); }
  .delta.bad { color: var(--bad); }

  .chart-wrap {
    height: 260px;
    position: relative;
  }

  .legend-row {
    display: flex;
    gap: 18px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  .cohort-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    margin-bottom: 4px;
  }

  .cohort-card {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 12px 10px;
    cursor: pointer;
    transition: border-color 0.12s ease;
  }

  .cohort-card:hover { border-color: var(--target); }
  .cohort-card.active { border-color: var(--target); background: var(--target-tint); }

  .cohort-card .cohort-label {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  .cohort-card .cohort-actual {
    font-size: 22px;
    line-height: 1;
  }

  .cohort-card .cohort-target {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .cohort-card .gap-tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .gap-tag.good { background: var(--good-tint); color: var(--good); }
  .gap-tag.bad { background: var(--bad-tint); color: var(--bad); }

  .cohort-card .not-tracked {
    color: var(--muted);
    font-size: 11.5px;
    font-style: italic;
    padding: 14px 0;
  }

  .not-reported-note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
    font-style: italic;
  }

  @media (max-width: 800px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .cohort-grid { grid-template-columns: repeat(2, 1fr); }
    header, .tab-bar, main { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>

const MONTHS_FY26 = ["Apr'25","May'25","Jun'25","Jul'25","Aug'25","Sep'25","Oct'25","Nov'25","Dec'25","Jan'26","Feb'26","Mar'26"];
const CHANNELS = ['Company', 'Agency', 'DD', 'PO', 'IM', 'Yodhha', 'CAB', 'Banca', 'Online', 'UK'];
const COHORTS = ['13M', '25M', '37M', '49M', '61M'];

function fmtCr(v) {
  if (v === null || v === undefined) return '\u2014';
  return '\u20B9' + Math.round(v).toLocaleString('en-IN') + ' Cr';
}
function fmtPct(v) {
  if (v === null || v === undefined) return '\u2014';
  return v.toFixed(1) + '%';
}

// Find the last month index (0-11) that has real reported data (non-null, non-zero)
// by checking a representative series across all channels for a given metric.
function lastReportedIndex(seriesArrays) {
  for (let i = 11; i >= 0; i--) {
    const hasReal = seriesArrays.some(arr => {
      const v = arr[i];
      return v !== null && v !== undefined && v !== 0;
    });
    if (hasReal) return i;
  }
  return -1;
}

function getMonthlySeries(monthlyObj, months) {
  return months.map(m => {
    const v = monthlyObj && monthlyObj[m];
    return v ? v.actual : null;
  });
}
function getTargetSeries(monthlyObj, months) {
  return months.map(m => {
    const v = monthlyObj && monthlyObj[m];
    return v ? v.target : null;
  });
}

function ytdSum(monthlyObj, months, uptoIdx) {
  let t = 0, a = 0;
  for (let i = 0; i <= uptoIdx; i++) {
    const v = monthlyObj && monthlyObj[months[i]];
    if (v) {
      t += v.target || 0;
      a += v.actual || 0;
    }
  }
  return { target: t, actual: a };
}

// ---------- Tab bar ----------
const tabBar = document.getElementById('tab-bar');
CHANNELS.forEach((ch, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i === 0 ? ' active' : '') + (ch === 'Company' ? ' company-tab' : '');
  btn.textContent = ch === 'Company' ? 'Company (Overall)' : ch;
  btn.dataset.channel = ch;
  btn.addEventListener('click', () => selectChannel(ch));
  tabBar.appendChild(btn);
});

let charts = {};
function destroyCharts() {
  Object.values(charts).forEach(c => c && c.destroy());
  charts = {};
}

function safeBuildChart(fn) {
  try {
    return fn();
  } catch (e) {
    console.error('Chart build failed:', e);
    return null;
  }
}

function selectChannel(ch) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.channel === ch));
  renderChannel(ch);
}

function metricSection(title, unitNote, dataFY27, dataFY26) {
  const actualFY27 = getMonthlySeries(dataFY27, MONTHS_FY27);
  const targetFY27 = getTargetSeries(dataFY27, MONTHS_FY27);
  const actualFY26 = getMonthlySeries(dataFY26, MONTHS_FY26);
  const cutoff = lastReportedIndex([actualFY27]);

  const ytd = ytdSum(dataFY27, MONTHS_FY27, cutoff >= 0 ? cutoff : -1);
  const ytdLY = ytdSum(dataFY26, MONTHS_FY26, cutoff >= 0 ? cutoff : -1);
  const achievement = ytd.target > 0 ? (ytd.actual / ytd.target * 100) : null;
  const yoyDelta = ytdLY.actual > 0 ? ((ytd.actual - ytdLY.actual) / ytdLY.actual * 100) : null;

  const id = title.replace(/\s+/g, '_');

  return `
    <div class="section">
      <div class="section-head">
        <h2>${title}</h2>
        <span class="unit-note">${unitNote}</span>
      </div>
      <div class="stat-row">
        <div class="stat-card">
          <div class="label">YTD Target</div>
          <div class="value target num">${fmtCr(ytd.target)}</div>
        </div>
        <div class="stat-card">
          <div class="label">YTD Actual</div>
          <div class="value actual num">${fmtCr(ytd.actual)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Achievement</div>
          <div class="value num">${achievement !== null ? achievement.toFixed(1) + '%' : '\u2014'}</div>
        </div>
        <div class="stat-card">
          <div class="label">vs LY (YTD)</div>
          <div class="value num">${yoyDelta !== null ? (yoyDelta >= 0 ? '+' : '') + yoyDelta.toFixed(1) + '%' : '\u2014'}</div>
          ${yoyDelta !== null ? `<div class="delta ${yoyDelta >= 0 ? 'good' : 'bad'}">${yoyDelta >= 0 ? '\u25B2 ahead of last year' : '\u25BC behind last year'}</div>` : ''}
        </div>
      </div>
      <div class="legend-row">
        <div class="legend-item"><span class="legend-dot" style="background:var(--target)"></span> 100% Target</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--actual)"></span> Achievement % FY27</div>
        <div class="legend-item"><span class="legend-dot" style="background:#C7CDD6"></span> Achievement % FY26 (LY)</div>
      </div>
      <div class="chart-wrap"><canvas id="chart_${id}"></canvas></div>
      ${cutoff < 11 ? `<div class="not-reported-note">Actuals reported through ${MONTHS_FY27[cutoff]}; later months awaiting data.</div>` : ''}
    </div>
  `;
}

function buildMetricChart(canvasId, dataFY27, dataFY26) {
  const targetFY27 = getTargetSeries(dataFY27, MONTHS_FY27);
  const actualFY27raw = getMonthlySeries(dataFY27, MONTHS_FY27);
  const targetFY26 = getTargetSeries(dataFY26, MONTHS_FY26);
  const actualFY26raw = getMonthlySeries(dataFY26, MONTHS_FY26);
  const cutoff = lastReportedIndex([actualFY27raw]);

  const achievementPct = (target, actual) => {
    if (target === null || target === undefined || target === 0) return null;
    if (actual === null || actual === undefined) return null;
    return Math.round((actual / target) * 1000) / 10;
  };

  const achievementFY27 = MONTHS_FY27.map((_, i) =>
    i <= cutoff ? achievementPct(targetFY27[i], actualFY27raw[i]) : null
  );
  const achievementFY26 = MONTHS_FY26.map((_, i) =>
    achievementPct(targetFY26[i], actualFY26raw[i])
  );
  const targetLine100 = MONTHS_FY27.map(() => 100);

  const ctx = document.getElementById(canvasId).getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: MONTHS_FY27,
      datasets: [
        {
          label: '100% Target', data: targetLine100,
          borderColor: '#3B6E8F', backgroundColor: 'transparent',
          borderDash: [4, 3], tension: 0, pointRadius: 0, fill: false,
        },
        {
          label: 'Achievement % FY27', data: achievementFY27,
          borderColor: '#D97B29', backgroundColor: 'rgba(217,123,41,0.12)',
          tension: 0.2, pointRadius: 3, fill: true,
        },
        {
          label: 'Achievement % FY26', data: achievementFY26,
          borderColor: '#C7CDD6', backgroundColor: 'transparent',
          borderDash: [2, 2], tension: 0.2, pointRadius: 0, fill: false,
        },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => v + '%' } } },
    },
  });
  return chart;
}

function cohortCard(cohort, dataFY27, dataFY26, isActive) {
  if (!dataFY27) {
    return `
      <div class="cohort-card">
        <div class="cohort-label">${cohort}</div>
        <div class="not-tracked">Not tracked at this stage</div>
      </div>
    `;
  }
  const actuals = getMonthlySeries(dataFY27, MONTHS_FY27);
  const targets = getTargetSeries(dataFY27, MONTHS_FY27);
  const cutoff = lastReportedIndex([actuals]);
  const latestActual = cutoff >= 0 ? actuals[cutoff] : null;
  const latestTarget = cutoff >= 0 ? targets[cutoff] : null;
  const hasTarget = latestTarget !== null && latestTarget !== undefined && latestTarget !== 0;
  const gap = (latestActual !== null && hasTarget) ? (latestActual - latestTarget) : null;

  return `
    <div class="cohort-card${isActive ? ' active' : ''}" data-cohort="${cohort}">
      <div class="cohort-label">${cohort}</div>
      <div class="cohort-actual num">${fmtPct(latestActual)}</div>
      <div class="cohort-target">Target: ${hasTarget ? fmtPct(latestTarget) : 'not set'}</div>
      ${gap !== null ? `<span class="gap-tag ${gap >= 0 ? 'good' : 'bad'}">${gap >= 0 ? '+' : ''}${gap.toFixed(1)} pts</span>` : ''}
    </div>
  `;
}

function buildCohortChart(canvasId, dataFY27, dataFY26) {
  const targetFY27 = getTargetSeries(dataFY27, MONTHS_FY27);
  const actualFY27raw = getMonthlySeries(dataFY27, MONTHS_FY27);
  const actualFY26raw = dataFY26 ? getMonthlySeries(dataFY26, MONTHS_FY26) : MONTHS_FY26.map(() => null);
  const cutoff = lastReportedIndex([actualFY27raw]);
  const actualFY27 = actualFY27raw.map((v, i) => (i <= cutoff ? v : null));

  const ctx = document.getElementById(canvasId).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: MONTHS_FY27,
      datasets: [
        { label: 'Target FY27', data: targetFY27, borderColor: '#3B6E8F', borderDash: [4, 3], tension: 0.2, pointRadius: 2, fill: false },
        { label: 'Actual FY27', data: actualFY27, borderColor: '#D97B29', backgroundColor: 'rgba(217,123,41,0.12)', tension: 0.2, pointRadius: 3, fill: true },
        { label: 'Actual FY26', data: actualFY26raw, borderColor: '#C7CDD6', borderDash: [2, 2], tension: 0.2, pointRadius: 0, fill: false },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { ticks: { callback: v => v + '%' } } },
    },
  });
}

let activeCohort = '13M';

function renderChannel(ch) {
  destroyCharts();
  const d = RAW_DATA[ch];
  const main = document.getElementById('main');

  main.innerHTML = `
    <div class="channel-title">${ch === 'Company' ? 'Company' : ch}</div>
    <div class="channel-sub">${ch === 'Company' ? 'All channels combined \u2014 book-weighted' : 'Full performance history'} &middot; FY27 vs FY26</div>

    ${metricSection('Accrual', 'Rs Crores', d.accrual.FY27, d.accrual.FY26)}
    ${metricSection('Cash Collection', 'Rs Crores', d.cash.FY27, d.cash.FY26)}

    <div class="section">
      <div class="section-head">
        <h2>Persistency \u2014 13M to 61M</h2>
        <span class="unit-note">Latest reported month</span>
      </div>
      <div class="cohort-grid" id="cohort-grid"></div>
      <div class="legend-row" style="margin-top:16px;">
        <div class="legend-item"><span class="legend-dot" style="background:var(--target)"></span> Target FY27</div>
        <div class="legend-item"><span class="legend-dot" style="background:var(--actual)"></span> Actual FY27</div>
        <div class="legend-item"><span class="legend-dot" style="background:#C7CDD6"></span> Actual FY26 (LY)</div>
      </div>
      <div class="chart-wrap"><canvas id="chart_cohort"></canvas></div>
    </div>
  `;

  charts['Accrual'] = safeBuildChart(() => buildMetricChart('chart_Accrual', d.accrual.FY27, d.accrual.FY26));
  charts['Cash_Collection'] = safeBuildChart(() => buildMetricChart('chart_Cash_Collection', d.cash.FY27, d.cash.FY26));

  const grid = document.getElementById('cohort-grid');
  grid.innerHTML = COHORTS.map(c => cohortCard(c, d.persistency[c].FY27, d.persistency[c].FY26, c === activeCohort)).join('');
  grid.querySelectorAll('.cohort-card[data-cohort]').forEach(card => {
    card.addEventListener('click', () => {
      activeCohort = card.dataset.cohort;
      grid.querySelectorAll('.cohort-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      if (charts['cohort']) charts['cohort'].destroy();
      charts['cohort'] = safeBuildChart(() => buildCohortChart('chart_cohort', d.persistency[activeCohort].FY27, d.persistency[activeCohort].FY26));
    });
  });
  charts['cohort'] = safeBuildChart(() => buildCohortChart('chart_cohort', d.persistency[activeCohort].FY27, d.persistency[activeCohort].FY26));
}

renderChannel(CHANNELS[0]);

</script>
